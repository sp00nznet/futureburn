# ============================================================================
#  futureburn — build + release pipeline (GitHub Actions)
# ============================================================================
#  futureburn is Windows-only (.NET 8 WPF + IMAPI COM + the 32-bit LightScribe
#  SDK), so everything runs on windows-latest — a *standard* GitHub-hosted
#  runner, free with unlimited minutes on public repos.
#
#  - Every push to main (and every manual run) builds, tests, and uploads the
#    two single-file x86 exes as a run artifact (bleeding-edge, downloadable
#    from the Actions run page).
#  - Pushing a version tag (vX.Y.Z) additionally publishes a proper GitHub
#    Release named after the tag, with auto-generated "what changed" notes and
#    the two exes attached. Cut a release with:
#        git tag v0.0.57 && git push origin v0.0.57
# ============================================================================

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # needed to create Releases

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  # Both executables are x86 (the LightScribe SDK is 32-bit only).
  RUNTIME: "win-x86"

jobs:
  build-test-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Futureburn.sln

      - name: Build (Release)
        run: dotnet build Futureburn.sln -c Release --no-restore

      - name: Test (xUnit)
        run: >
          dotnet test tests/Futureburn.Core.Tests/Futureburn.Core.Tests.csproj
          -c Release
          --logger "trx;LogFileName=futureburn-tests.trx"
          --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      # Two self-contained, single-file x86 builds — the whole .NET runtime plus
      # every managed and native dependency in one .exe. IncludeAllContentForSelfExtract
      # forces a full extract to a temp dir on first run: required for the WPF GUI
      # on x86 (otherwise SetWindowLongWndProc DllNotFoundException), kept on the
      # CLI for consistency.
      - name: Publish CLI (single-file x86)
        run: >
          dotnet publish src/Futureburn.Cli/Futureburn.Cli.csproj
          -c Release -r ${{ env.RUNTIME }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true
          -o publish/cli

      - name: Publish GUI (single-file x86)
        run: >
          dotnet publish src/Futureburn.Gui/Futureburn.Gui.csproj
          -c Release -r ${{ env.RUNTIME }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true
          -o publish/gui

      # Bleeding-edge binaries from every build, downloadable from the run page.
      - name: Upload binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: futureburn-windows-x86
          path: |
            publish/cli/Futureburn.Cli.exe
            publish/gui/Futureburn.Gui.exe

      # Only on a version tag: publish a proper Release with auto-generated notes.
      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} `
            publish/cli/Futureburn.Cli.exe `
            publish/gui/Futureburn.Gui.exe `
            --title ${{ github.ref_name }} `
            --generate-notes `
            --latest
